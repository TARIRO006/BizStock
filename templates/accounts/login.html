<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BizStock</title>
</head>

<body>

    <h1>Welcome back</h1>

    <p>Login to your BizStock account.</p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div>
            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >
        </div>

        <div>
            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Create one
        </a>
    </p>

</body>
</html>
